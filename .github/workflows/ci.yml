name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Ubuntu fijo: el cambio a una versión nueva se hace a propósito, porque Playwright instala sus
# dependencias del sistema (--with-deps) y puede no soportar todavía una versión recién salida.
jobs:
  verificar:
    name: Formato, lint, tipos, pruebas y build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Extremo a extremo (iPhone y Android simulados)
    needs: verificar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @miluca/e2e exec playwright install --with-deps chromium webkit
      - run: pnpm turbo run build --filter=@miluca/web
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

  base-de-datos:
    name: Base de datos (migraciones, pgTAP y tipos)
    runs-on: ubuntu-24.04
    env:
      # config.toml lee el secreto de Google al arrancar; la base de datos no lo usa.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: sin-secreto-en-ci
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase db start
      - run: pnpm supabase migration up --local
      - run: pnpm test:db
      - run: pnpm supabase db lint --local --level warning --fail-on warning
      - name: Los tipos generados están al día
        run: pnpm db:types && git diff --exit-code packages/db/src/database.types.ts

  herramientas:
    name: Herramientas de Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m py_compile tools/excel-extractor/*.py tools/legal-texts/*.py
      # Los textos legales se leen bien. Termina con 1 si hay una versión nueva sin aprobar o incompleta.
      - run: python3 tools/legal-texts/build_migration.py || test $? -eq 1
