<!-- Recuperación de contraseña de MiLuca (P-G05, ADR 0009): solo el código, sin enlace. Un enlace
     se abriría en Safari y no en la app instalada, y algunos filtros de correo abren los enlaces. -->
<div style="font-family: Arial, Helvetica, sans-serif; color: #2a2f63; max-width: 480px">
  <h1 style="font-size: 20px">Tu código para cambiar la contraseña</h1>
  <p>Escribe este código en MiLuca, en la pantalla "Recuperar contraseña":</p>
  <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px">{{ .Token }}</p>
  <p>
    Vence en 1 hora. Si no pediste cambiar tu contraseña, ignora este correo: tu cuenta sigue igual.
  </p>
  <p style="color: #4b5070; font-size: 13px">MiLuca · planificación financiera personal</p>
</div>
